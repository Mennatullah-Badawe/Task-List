<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task list</title>
    <link rel="stylesheet" href="tasklist.css" />
  </head>
  <body>
  </head>

  <body>

    <div class="container">
      <h1 id="header">My Task List</h1>
      <input type="text" id="taskInput" placeholder="Enter a task" />
      <input type="color" id="colorInput" />

      <button onclick="addTask()">Add Task</button>
      <ul id="list"></ul>
    </div>
    
    <script>
      function addTask() {
        let text = document.querySelector("#taskInput");
        let list = document.querySelector("#list");
        let color = document.querySelector("#colorInput");

        list.innerHTML += `<li style="background:linear-gradient(white, ${color.value});">${text.value}</li>`;
        text.value = " ";
      }
    </script>
  </body>
</html>
